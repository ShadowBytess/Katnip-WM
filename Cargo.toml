[workspace]
resolver = "2"
members = [
    "crates/katnip",
    "crates/katnip-backend",
    "crates/katnip-core",
    "crates/katnip-config",
    "crates/katnip-api",
    "crates/katnip-plugins",
    "crates/katnipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["LuminousCat (@ShadowBytess)"]

[workspace.dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "desktop",
    "wayland_frontend",
] }
xkbcommon = { version = "0.8", features = ["wayland"] }
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = true
